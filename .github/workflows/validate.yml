name: Validate audits

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install audit tooling
        run: |
          python -m pip install --requirement requirements.txt
          npm ci --no-audit --no-fund

      - name: Validate schemas, events, dossiers, signatures, and indexes
        run: npm test

      - name: Enforce append-only merged dossiers
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-status "origin/${BASE_REF}...HEAD" -- audits)
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(M|D|R[0-9]*|C[0-9]*)[[:space:]]'; then
            echo "Merged audit dossiers are append-only; publish a new dossier or lifecycle event."
            exit 1
          fi
